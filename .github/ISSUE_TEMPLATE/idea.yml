name: Suggest an improvement
description: Propose a change to a dictation workflow, platform, or contributor experience
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What workflow would improve?
      description: Explain the problem and who runs into it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: Describe the smallest change that would help and note any platform requirements.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or related work
      description: Share a safe sample, relevant issue, or sketch if you have one.
