name: Report an accessibility barrier
description: Share a barrier in the web studio, desktop workspace, or Android app
title: "[Accessibility] "
labels: ["accessibility"]
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Name the screen or control and describe the steps that led to the barrier.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What happened and what would help?
      description: Describe the observed behavior. Suggest an improvement if you have one.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Device, app version, and access method
      description: Include a browser, zoom level, keyboard, or assistive technology version if relevant.
