[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarscribe"
version = "0.5.0"
description = "Offline-first AI dictation that out-thinks Wispr Flow: dual-engine transcription, smart cleanup, command mode, code mode, meeting notes and analytics, 100 percent private by default."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Saif Modan", email = "saifmodan000@gmail.com" }]
requires-python = ">=3.10"
keywords = ["dictation", "speech-to-text", "whisper", "parakeet",
            "voice", "wispr-flow-alternative", "offline-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0", "av<15"]
parakeet = ["nemo-toolkit[asr]"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
desktop = ["pynput", "pyperclip", "sounddevice", "soundfile", "numpy"]
llm = []
all = ["faster-whisper>=1.0", "fastapi>=0.110", "uvicorn>=0.29",
       "pynput", "pyperclip", "sounddevice", "soundfile", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
swarscribe = "swarscribe.cli:main"

[project.urls]
Homepage = "https://github.com/saifmodan2006/swarscribe"
Portfolio = "https://www.devbysaif.in/"

[tool.setuptools.packages.find]
where = ["src"]
